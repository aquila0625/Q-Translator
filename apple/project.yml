# XcodeGen spec. Run `Scripts/fetch_umeng.sh` once, then `xcodegen generate` in this folder to create QTranslator.xcodeproj.
name: QTranslator
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_NAME: Q-Translator
    PRODUCT_BUNDLE_IDENTIFIER: com.yishulabs.qtranslator
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  QTranslator-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    settings:
      base:
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # 真机安装需要你自己的 Apple 开发团队 ID：QTRANSLATOR_TEAM_ID=XXXXXXXXXX xcodegen generate
        DEVELOPMENT_TEAM: ${QTRANSLATOR_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        # 友盟统计是静态库，里面有 Objective-C 分类
        OTHER_LDFLAGS: $(inherited) -ObjC
    # 友盟 AppKey 在 Config/Local.xcconfig（不提交）；没有就不发统计
    configFiles:
      Debug: Config/Analytics.xcconfig
      Release: Config/Analytics.xcconfig
    # 友盟统计 SDK：先运行 Scripts/fetch_umeng.sh 下载
    dependencies:
      - framework: Vendor/Umeng/UMCommon.xcframework
        embed: false
      - framework: Vendor/Umeng/UMDevice.xcframework
        embed: false
      - sdk: CoreTelephony.framework
      - sdk: SystemConfiguration.framework
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
    scheme: {}
  QTranslator-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    settings:
      base:
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
    configFiles:
      Debug: Config/Analytics.xcconfig
      Release: Config/Analytics.xcconfig
    scheme: {}
